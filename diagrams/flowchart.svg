<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 850">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
    </marker>
    <marker id="arrow-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fb7185"/>
    </marker>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
    text { font-family: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', monospace; }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Title -->
  <text x="30" y="40" fill="white" font-size="16" font-weight="700">Flujo de Procesamiento del Agente Ingestor</text>
  <text x="30" y="55" fill="#94a3b8" font-size="10">Diagrama de flujo (Happy path y decisiones de curación)</text>

  <!-- Start Node -->
  <rect x="350" y="80" width="160" height="60" rx="30" fill="#0f172a"/>
  <rect x="350" y="80" width="160" height="60" rx="30" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="430" y="104" fill="white" font-size="11" font-weight="600" text-anchor="middle">Cambio en Atlassian</text>
  <text x="430" y="120" fill="#94a3b8" font-size="9" text-anchor="middle">(Jira / Confluence)</text>

  <line x1="430" y1="140" x2="430" y2="180" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Process: Recibir Webhook -->
  <rect x="350" y="180" width="160" height="60" rx="6" fill="#0f172a"/>
  <rect x="350" y="180" width="160" height="60" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="430" y="204" fill="white" font-size="11" font-weight="600" text-anchor="middle">Recibir Webhook</text>
  <text x="430" y="220" fill="#94a3b8" font-size="9" text-anchor="middle">Validar firma &amp; extraer ID</text>

  <line x1="430" y1="240" x2="430" y2="280" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Process: Consultar API -->
  <rect x="350" y="280" width="160" height="60" rx="6" fill="#0f172a"/>
  <rect x="350" y="280" width="160" height="60" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="430" y="304" fill="white" font-size="11" font-weight="600" text-anchor="middle">Consultar API</text>
  <text x="430" y="320" fill="#94a3b8" font-size="9" text-anchor="middle">Obtener contenido completo</text>

  <line x1="430" y1="340" x2="430" y2="380" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Decision: LLM Curation -->
  <g transform="translate(430, 415)">
    <polygon points="0,-35 70,0 0,35 -70,0" fill="#0f172a"/>
    <polygon points="0,-35 70,0 0,35 -70,0" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
    <text y="4" fill="white" font-size="10" font-weight="600" text-anchor="middle">¿Cambio relevante?</text>
  </g>

  <!-- Decision Branch: No -->
  <line x1="500" y1="415" x2="650" y2="415" stroke="#fb7185" stroke-width="1.5" marker-end="url(#arrow-rose)"/>
  <text x="540" y="405" fill="#fb7185" font-size="9" font-weight="600">No (menor/spam)</text>

  <!-- End Node (Discarded) -->
  <rect x="650" y="385" width="120" height="60" rx="30" fill="#0f172a"/>
  <rect x="650" y="385" width="120" height="60" rx="30" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="710" y="415" fill="white" font-size="11" font-weight="600" text-anchor="middle">Descartar</text>
  <text x="710" y="430" fill="#fb7185" font-size="8" text-anchor="middle">Fin del proceso</text>

  <!-- Decision Branch: Yes -->
  <line x1="430" y1="450" x2="430" y2="500" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow-cyan)"/>
  <text x="445" y="480" fill="#34d399" font-size="9" font-weight="600">Sí</text>

  <!-- Process: Extraer Metadatos -->
  <rect x="350" y="500" width="160" height="60" rx="6" fill="#0f172a"/>
  <rect x="350" y="500" width="160" height="60" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="430" y="524" fill="white" font-size="11" font-weight="600" text-anchor="middle">Limpieza &amp; Resumen</text>
  <text x="430" y="540" fill="#94a3b8" font-size="9" text-anchor="middle">LLM extrae tags/entidades</text>

  <line x1="430" y1="560" x2="430" y2="600" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Process: Generar Embedding -->
  <rect x="350" y="600" width="160" height="60" rx="6" fill="#0f172a"/>
  <rect x="350" y="600" width="160" height="60" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="430" y="624" fill="white" font-size="11" font-weight="600" text-anchor="middle">Generar Embedding</text>
  <text x="430" y="640" fill="#94a3b8" font-size="9" text-anchor="middle">Voyage AI (1024 dims)</text>

  <line x1="430" y1="660" x2="430" y2="700" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Process: Upsert MongoDB -->
  <rect x="350" y="700" width="160" height="60" rx="6" fill="#0f172a"/>
  <rect x="350" y="700" width="160" height="60" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="430" y="724" fill="white" font-size="11" font-weight="600" text-anchor="middle">Upsert Documento</text>
  <text x="430" y="740" fill="#94a3b8" font-size="9" text-anchor="middle">MongoDB Atlas Vector Store</text>

  <line x1="430" y1="760" x2="430" y2="800" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- End Node -->
  <rect x="350" y="800" width="160" height="40" rx="20" fill="#0f172a"/>
  <rect x="350" y="800" width="160" height="40" rx="20" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="430" y="824" fill="white" font-size="11" font-weight="600" text-anchor="middle">Fin: Base Actualizada</text>

</svg>
