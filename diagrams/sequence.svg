<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
    text { font-family: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', monospace; }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Title -->
  <text x="30" y="40" fill="white" font-size="16" font-weight="700">Diagrama de Secuencia: Ingesta Curada con LLM</text>
  <text x="30" y="55" fill="#94a3b8" font-size="10">Interacción entre Atlassian, Backend, LLM y MongoDB</text>

  <!-- Lifelines -->
  <!-- Atlassian -->
  <line x1="120" y1="85" x2="120" y2="650" stroke="#334155" stroke-width="1" stroke-dasharray="6,4"/>
  <!-- Controller -->
  <line x1="320" y1="85" x2="320" y2="650" stroke="#334155" stroke-width="1" stroke-dasharray="6,4"/>
  <!-- Service -->
  <line x1="520" y1="85" x2="520" y2="650" stroke="#334155" stroke-width="1" stroke-dasharray="6,4"/>
  <!-- LLM/Embeddings -->
  <line x1="720" y1="85" x2="720" y2="650" stroke="#334155" stroke-width="1" stroke-dasharray="6,4"/>
  <!-- MongoDB -->
  <line x1="900" y1="85" x2="900" y2="650" stroke="#334155" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- Actors -->
  <!-- Atlassian -->
  <rect x="55" y="40" width="130" height="45" rx="6" fill="#0f172a"/>
  <rect x="55" y="40" width="130" height="45" rx="6" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="120" y="67" fill="white" font-size="11" font-weight="600" text-anchor="middle">Atlassian (Jira/Conf)</text>

  <!-- Controller -->
  <rect x="255" y="40" width="130" height="45" rx="6" fill="#0f172a"/>
  <rect x="255" y="40" width="130" height="45" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="320" y="67" fill="white" font-size="11" font-weight="600" text-anchor="middle">WebhookController</text>

  <!-- Service -->
  <rect x="455" y="40" width="130" height="45" rx="6" fill="#0f172a"/>
  <rect x="455" y="40" width="130" height="45" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="520" y="67" fill="white" font-size="11" font-weight="600" text-anchor="middle">IngestService</text>

  <!-- LLM/Embeddings -->
  <rect x="655" y="40" width="130" height="45" rx="6" fill="#0f172a"/>
  <rect x="655" y="40" width="130" height="45" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="720" y="67" fill="white" font-size="11" font-weight="600" text-anchor="middle">Gemini &amp; Voyage</text>

  <!-- MongoDB -->
  <rect x="835" y="40" width="130" height="45" rx="6" fill="#0f172a"/>
  <rect x="835" y="40" width="130" height="45" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="900" y="67" fill="white" font-size="11" font-weight="600" text-anchor="middle">MongoDB Atlas</text>


  <!-- Messages -->

  <!-- 1. Webhook Post -->
  <line x1="120" y1="130" x2="320" y2="130" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="220" y="122" fill="#e2e8f0" font-size="9" text-anchor="middle">1. POST /webhook (pageId)</text>
  <rect x="315" y="130" width="10" height="470" rx="2" fill="rgba(8,51,68,0.6)" stroke="#22d3ee" stroke-width="1"/>

  <!-- 2. Async ACK -->
  <line x1="320" y1="160" x2="120" y2="160" stroke="#64748b" stroke-width="1" stroke-dasharray="6,3" marker-end="url(#arrow)"/>
  <text x="220" y="152" fill="#94a3b8" font-size="8" text-anchor="middle" font-style="italic">202 Accepted</text>

  <!-- 3. Trigger Service -->
  <line x1="320" y1="190" x2="520" y2="190" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="420" y="182" fill="#e2e8f0" font-size="9" text-anchor="middle">2. processIngestion(pageId)</text>
  <rect x="515" y="190" width="10" height="390" rx="2" fill="rgba(6,78,59,0.6)" stroke="#34d399" stroke-width="1"/>

  <!-- 4. Fetch Content -->
  <line x1="520" y1="220" x2="120" y2="220" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="320" y="212" fill="#e2e8f0" font-size="9" text-anchor="middle">3. GET /rest/api/content/{id}</text>
  
  <line x1="120" y1="250" x2="520" y2="250" stroke="#64748b" stroke-width="1" stroke-dasharray="6,3" marker-end="url(#arrow)"/>
  <text x="320" y="242" fill="#94a3b8" font-size="8" text-anchor="middle" font-style="italic">HTML/Markdown crudo</text>

  <!-- Alt Frame: LLM Curation -->
  <rect x="440" y="280" width="350" height="150" rx="4" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="440" y="280" width="50" height="18" rx="4" fill="rgba(30,41,59,0.8)" stroke="#64748b" stroke-width="1"/>
  <text x="465" y="293" fill="#94a3b8" font-size="8" font-weight="600" text-anchor="middle">opt</text>
  <text x="500" y="293" fill="#94a3b8" font-size="8" font-style="italic">[Curación LLM]</text>

  <!-- 5. LLM Clean/Summarize -->
  <line x1="520" y1="320" x2="720" y2="320" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="620" y="312" fill="#e2e8f0" font-size="9" text-anchor="middle">4. summarizeAndExtract()</text>
  <rect x="715" y="320" width="10" height="40" rx="2" fill="rgba(120,53,15,0.6)" stroke="#fbbf24" stroke-width="1"/>

  <line x1="720" y1="360" x2="520" y2="360" stroke="#64748b" stroke-width="1" stroke-dasharray="6,3" marker-end="url(#arrow)"/>
  <text x="620" y="352" fill="#94a3b8" font-size="8" text-anchor="middle" font-style="italic">Texto limpio + Metadatos JSON</text>


  <!-- 6. Vectorize -->
  <line x1="520" y1="460" x2="720" y2="460" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="620" y="452" fill="#e2e8f0" font-size="9" text-anchor="middle">5. generateEmbeddings(text)</text>
  <rect x="715" y="460" width="10" height="40" rx="2" fill="rgba(120,53,15,0.6)" stroke="#fbbf24" stroke-width="1"/>

  <line x1="720" y1="500" x2="520" y2="500" stroke="#64748b" stroke-width="1" stroke-dasharray="6,3" marker-end="url(#arrow)"/>
  <text x="620" y="492" fill="#94a3b8" font-size="8" text-anchor="middle" font-style="italic">float[] vector</text>

  <!-- 7. Upsert MongoDB -->
  <line x1="520" y1="540" x2="900" y2="540" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="710" y="532" fill="#e2e8f0" font-size="9" text-anchor="middle">6. upsert(docId, text, vector, metadata)</text>
  <rect x="895" y="540" width="10" height="40" rx="2" fill="rgba(76,29,149,0.6)" stroke="#a78bfa" stroke-width="1"/>

  <line x1="900" y1="580" x2="520" y2="580" stroke="#64748b" stroke-width="1" stroke-dasharray="6,3" marker-end="url(#arrow)"/>
  <text x="710" y="572" fill="#94a3b8" font-size="8" text-anchor="middle" font-style="italic">OK / Documento guardado</text>


</svg>
