<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
    </marker>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
    text { font-family: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', monospace; }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Title -->
  <text x="30" y="40" fill="white" font-size="16" font-weight="700">Confluence &amp; Jira Ingestion Architecture</text>
  <text x="30" y="55" fill="#94a3b8" font-size="10">Automated synchronization between Atlassian and MongoDB Atlas using Webhooks and LLM Curation</text>

  <!-- Regions -->
  <!-- Atlassian Cloud -->
  <rect x="40" y="80" width="200" height="300" rx="12" fill="none" stroke="#60a5fa" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="52" y="96" fill="#60a5fa" font-size="9" font-weight="600">Atlassian Cloud</text>

  <!-- Liverpool RAG Backend -->
  <rect x="300" y="80" width="400" height="420" rx="12" fill="none" stroke="#fbbf24" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="312" y="96" fill="#fbbf24" font-size="9" font-weight="600">Liverpool RAG Backend (Java Spring Boot)</text>

  <!-- Data/AI Layer -->
  <rect x="760" y="80" width="200" height="420" rx="12" fill="none" stroke="#a78bfa" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="772" y="96" fill="#a78bfa" font-size="9" font-weight="600">Data &amp; External AI</text>


  <!-- Connections (Arrows) -->
  <!-- Webhooks to Controller -->
  <path d="M 220 150 L 330 150" fill="none" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
  <text x="275" y="142" fill="#22d3ee" font-size="8" text-anchor="middle">Webhook POST</text>

  <path d="M 220 280 L 260 280 L 260 170 L 330 170" fill="none" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
  <text x="275" y="185" fill="#22d3ee" font-size="8" text-anchor="middle">Webhook POST</text>

  <!-- Controller to Service -->
  <path d="M 490 160 L 530 160" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  
  <!-- Service to LLM -->
  <path d="M 690 140 L 800 140" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="745" y="132" fill="#94a3b8" font-size="8" text-anchor="middle">Analyze/Summarize</text>

  <!-- LLM back to Service (using Open Arrow / Path) -->
  <path d="M 800 160 L 690 160" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="4,2" marker-end="url(#arrow)"/>

  <!-- Service to Embeddings -->
  <path d="M 610 190 L 610 260" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Embeddings to Voyage -->
  <path d="M 690 290 L 800 290" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="745" y="282" fill="#94a3b8" font-size="8" text-anchor="middle">Generate Vector</text>
  
  <!-- Voyage back to Embeddings -->
  <path d="M 800 310 L 690 310" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="4,2" marker-end="url(#arrow)"/>

  <!-- Embeddings to Vector Store Adapter -->
  <path d="M 610 320 L 610 400" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Vector Store to MongoDB -->
  <path d="M 690 430 L 800 430" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="745" y="422" fill="#94a3b8" font-size="8" text-anchor="middle">Upsert Document</text>


  <!-- Components -->

  <!-- Atlassian Cloud Box 1: Confluence -->
  <rect x="60" y="120" width="160" height="60" rx="6" fill="#0f172a"/>
  <rect x="60" y="120" width="160" height="60" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="140" y="144" fill="white" font-size="11" font-weight="600" text-anchor="middle">Confluence</text>
  <text x="140" y="160" fill="#94a3b8" font-size="9" text-anchor="middle">Page Created/Updated</text>

  <!-- Atlassian Cloud Box 2: Jira -->
  <rect x="60" y="250" width="160" height="60" rx="6" fill="#0f172a"/>
  <rect x="60" y="250" width="160" height="60" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="140" y="274" fill="white" font-size="11" font-weight="600" text-anchor="middle">Jira Software</text>
  <text x="140" y="290" fill="#94a3b8" font-size="9" text-anchor="middle">Issue Created/Updated</text>


  <!-- Backend Box 1: Webhook Controller -->
  <rect x="330" y="130" width="160" height="60" rx="6" fill="#0f172a"/>
  <rect x="330" y="130" width="160" height="60" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="410" y="154" fill="white" font-size="11" font-weight="600" text-anchor="middle">WebhookController</text>
  <text x="410" y="170" fill="#94a3b8" font-size="9" text-anchor="middle">REST API Endpoint</text>

  <!-- Backend Box 2: RagService (LLM Curator) -->
  <rect x="530" y="130" width="160" height="60" rx="6" fill="#0f172a"/>
  <rect x="530" y="130" width="160" height="60" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="610" y="154" fill="white" font-size="11" font-weight="600" text-anchor="middle">IngestUseCase (Service)</text>
  <text x="610" y="170" fill="#94a3b8" font-size="9" text-anchor="middle">Content Curation Logic</text>

  <!-- Backend Box 3: Embedding Adapter -->
  <rect x="530" y="260" width="160" height="60" rx="6" fill="#0f172a"/>
  <rect x="530" y="260" width="160" height="60" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="610" y="284" fill="white" font-size="11" font-weight="600" text-anchor="middle">VoyageAiAdapter</text>
  <text x="610" y="300" fill="#94a3b8" font-size="9" text-anchor="middle">implements EmbeddingPort</text>

  <!-- Backend Box 4: Mongo Adapter -->
  <rect x="530" y="400" width="160" height="60" rx="6" fill="#0f172a"/>
  <rect x="530" y="400" width="160" height="60" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="610" y="424" fill="white" font-size="11" font-weight="600" text-anchor="middle">MongoVectorStoreAdapter</text>
  <text x="610" y="440" fill="#94a3b8" font-size="9" text-anchor="middle">VectorStorePort</text>


  <!-- Data/AI Box 1: Gemini/LLM -->
  <rect x="800" y="130" width="140" height="60" rx="6" fill="#0f172a"/>
  <rect x="800" y="130" width="140" height="60" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="870" y="154" fill="white" font-size="11" font-weight="600" text-anchor="middle">LLM API</text>
  <text x="870" y="170" fill="#94a3b8" font-size="9" text-anchor="middle">Gemini / OpenAI</text>

  <!-- Data/AI Box 2: Voyage AI -->
  <rect x="800" y="260" width="140" height="60" rx="6" fill="#0f172a"/>
  <rect x="800" y="260" width="140" height="60" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="870" y="284" fill="white" font-size="11" font-weight="600" text-anchor="middle">Voyage AI</text>
  <text x="870" y="300" fill="#94a3b8" font-size="9" text-anchor="middle">voyage-3 Embeddings</text>

  <!-- Data/AI Box 3: MongoDB -->
  <g transform="translate(800, 400)">
    <rect x="0" y="10" width="140" height="50" rx="2" fill="#0f172a"/>
    <ellipse cx="70" cy="10" rx="70" ry="12" fill="#0f172a"/>
    <ellipse cx="70" cy="60" rx="70" ry="12" fill="#0f172a"/>
    <rect x="0" y="10" width="140" height="50" fill="rgba(76,29,149,0.4)"/>
    <ellipse cx="70" cy="10" rx="70" ry="12" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
    <ellipse cx="70" cy="60" rx="70" ry="12" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
    <line x1="0" y1="10" x2="0" y2="60" stroke="#a78bfa" stroke-width="1.5"/>
    <line x1="140" y1="10" x2="140" y2="60" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="70" y="40" fill="white" font-size="11" font-weight="600" text-anchor="middle">MongoDB Atlas</text>
  </g>

</svg>
