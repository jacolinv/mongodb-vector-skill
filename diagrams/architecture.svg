<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 960">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', monospace, sans-serif; }
    </style>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Background Layer -->
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Title -->
  <text x="40" y="40" fill="white" font-size="16" font-weight="700">Arquitectura: Agente IA con MongoDB Vector Search</text>

  <!-- Regions Layer -->
  <rect x="20" y="110" width="1170" height="520" rx="12" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="32" y="130" fill="#94a3b8" font-size="11" font-weight="600">Entorno Local (Workspace)</text>

  <rect x="910" y="130" width="260" height="110" rx="12" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="922" y="150" fill="#60a5fa" font-size="11" font-weight="600">Capa de IA &amp; Agente</text>

  <rect x="270" y="140" width="540" height="360" rx="12" fill="none" stroke="#34d399" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="282" y="160" fill="#34d399" font-size="11" font-weight="600">Pipeline de Ingesta (Python)</text>

  <rect x="910" y="270" width="260" height="340" rx="12" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="922" y="290" fill="#60a5fa" font-size="11" font-weight="600">Pipeline MCP Server (Node.js)</text>

  <rect x="270" y="680" width="900" height="160" rx="12" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="282" y="700" fill="#fbbf24" font-size="11" font-weight="600">Servicios Externos (Cloud)</text>

  <!-- Connection Lines Layer -->
  <g fill="none" stroke="#64748b" stroke-width="1.5">
    <!-- User to Agent -->
    <path d="M 900 60 L 1040 60 L 1040 170" marker-end="url(#arrow)"/>
    <path d="M 1060 170 L 1060 80 L 900 80" marker-end="url(#arrow)"/>
    
    <!-- User to Ingest -->
    <path d="M 680 70 L 540 70 L 540 170" marker-end="url(#arrow)"/>
    
    <!-- Agent to MCP -->
    <path d="M 1030 230 L 1030 290" marker-end="url(#arrow)"/>
    <path d="M 1050 290 L 1050 230" marker-end="url(#arrow)"/>
    
    <!-- Archivos to Ingest -->
    <path d="M 250 200 L 430 200" marker-end="url(#arrow)"/>
    
    <!-- Ingest to Children -->
    <path d="M 540 230 L 540 440"/>
    <path d="M 540 320 L 510 320" marker-end="url(#arrow)"/>
    <path d="M 540 320 L 570 320" marker-end="url(#arrow)"/>
    <path d="M 540 440 L 510 440" marker-end="url(#arrow)"/>
    <path d="M 540 440 L 570 440" marker-end="url(#arrow)"/>
    
    <!-- EmbeddingsPy to VoyageAI -->
    <path d="M 390 470 L 390 720" marker-end="url(#arrow)"/>
    <path d="M 410 720 L 410 470" marker-end="url(#arrow)"/>
    
    <!-- MongoPy to MongoDB -->
    <path d="M 790 440 L 890 440 L 890 770 L 960 770" marker-end="url(#arrow)"/>
    
    <!-- MongoPy to GoogleChat -->
    <path d="M 680 470 L 680 720" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
    
    <!-- MCP to Tools to QueryJS -->
    <path d="M 1040 350 L 1040 410" marker-end="url(#arrow)"/>
    <path d="M 1040 470 L 1040 530" marker-end="url(#arrow)"/>
    
    <!-- QueryJS to MongoDB -->
    <path d="M 1030 590 L 1030 750" marker-end="url(#arrow)"/>
    <path d="M 1050 750 L 1050 590" marker-end="url(#arrow)"/>
  </g>

  <!-- Labels Layer -->
  <g fill="#94a3b8" font-size="9">
    <text x="970" y="50" text-anchor="end">Prompt / Pregunta</text>
    <text x="970" y="95" text-anchor="end">Genera Respuesta Aumentada RAG</text>
    
    <text x="610" y="60" text-anchor="middle">Comando de Ingesta</text>
    
    <text x="1070" y="265" text-anchor="start">Protocolo MCP (JSON-RPC stdio)</text>
    
    <text x="420" y="595" text-anchor="start">Generación de Vectores</text>
    
    <text x="690" y="595" text-anchor="start">Notifica subidas/reemplazos</text>
    
    <text x="895" y="520" text-anchor="start">Persistencia de</text>
    <text x="895" y="532" text-anchor="start">Chunks &amp; Vectores</text>
    
    <text x="1060" y="670" text-anchor="start">Consulta $vectorSearch</text>
    <text x="1060" y="682" text-anchor="start">/ find</text>
  </g>

  <!-- Components Layer -->
  <!-- User -->
  <g transform="translate(680, 40)">
    <rect x="0" y="0" width="220" height="60" rx="6" fill="#0f172a"/>
    <rect x="0" y="0" width="220" height="60" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="110" y="34" fill="white" font-size="12" font-weight="600" text-anchor="middle">👤 Usuario / Desarrollador</text>
  </g>

  <!-- Archivos Locales -->
  <g transform="translate(30, 170)">
    <rect x="0" y="0" width="220" height="60" rx="6" fill="#0f172a"/>
    <rect x="0" y="0" width="220" height="60" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="110" y="26" fill="white" font-size="12" font-weight="600" text-anchor="middle">📁 Archivos Locales</text>
    <text x="110" y="42" fill="#94a3b8" font-size="9" text-anchor="middle">(.md, .pdf, .docx, .jpg, etc.)</text>
  </g>

  <!-- Agent -->
  <g transform="translate(930, 170)">
    <rect x="0" y="0" width="220" height="60" rx="6" fill="#0f172a"/>
    <rect x="0" y="0" width="220" height="60" rx="6" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="110" y="26" fill="white" font-size="12" font-weight="600" text-anchor="middle">🤖 Agente IA / LLM Client</text>
    <text x="110" y="42" fill="#94a3b8" font-size="9" text-anchor="middle">(Antigravity / Claude / Custom)</text>
  </g>

  <!-- Ingest -->
  <g transform="translate(430, 170)">
    <rect x="0" y="0" width="220" height="60" rx="6" fill="#0f172a"/>
    <rect x="0" y="0" width="220" height="60" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
    <text x="110" y="26" fill="white" font-size="12" font-weight="600" text-anchor="middle">ingest.py / force_ingest.py</text>
    <text x="110" y="42" fill="#94a3b8" font-size="9" text-anchor="middle">(Controlador Principal)</text>
  </g>

  <!-- Loaders -->
  <g transform="translate(290, 290)">
    <rect x="0" y="0" width="220" height="60" rx="6" fill="#0f172a"/>
    <rect x="0" y="0" width="220" height="60" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
    <text x="110" y="26" fill="white" font-size="12" font-weight="600" text-anchor="middle">loaders.py</text>
    <text x="110" y="42" fill="#94a3b8" font-size="9" text-anchor="middle">(Extracción de Texto/Visión)</text>
  </g>

  <!-- Chunker -->
  <g transform="translate(570, 290)">
    <rect x="0" y="0" width="220" height="60" rx="6" fill="#0f172a"/>
    <rect x="0" y="0" width="220" height="60" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
    <text x="110" y="26" fill="white" font-size="12" font-weight="600" text-anchor="middle">chunker.py</text>
    <text x="110" y="42" fill="#94a3b8" font-size="9" text-anchor="middle">(Segmentación Inteligente)</text>
  </g>

  <!-- EmbeddingsPy -->
  <g transform="translate(290, 410)">
    <rect x="0" y="0" width="220" height="60" rx="6" fill="#0f172a"/>
    <rect x="0" y="0" width="220" height="60" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
    <text x="110" y="26" fill="white" font-size="12" font-weight="600" text-anchor="middle">embeddings.py</text>
    <text x="110" y="42" fill="#94a3b8" font-size="9" text-anchor="middle">(Cliente Voyage AI)</text>
  </g>

  <!-- MongoPy -->
  <g transform="translate(570, 410)">
    <rect x="0" y="0" width="220" height="60" rx="6" fill="#0f172a"/>
    <rect x="0" y="0" width="220" height="60" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
    <text x="110" y="26" fill="white" font-size="12" font-weight="600" text-anchor="middle">mongodb.py</text>
    <text x="110" y="42" fill="#94a3b8" font-size="9" text-anchor="middle">(Cliente MongoDB)</text>
  </g>

  <!-- MCP -->
  <g transform="translate(930, 290)">
    <rect x="0" y="0" width="220" height="60" rx="6" fill="#0f172a"/>
    <rect x="0" y="0" width="220" height="60" rx="6" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="110" y="26" fill="white" font-size="12" font-weight="600" text-anchor="middle">mcp-server.js</text>
    <text x="110" y="42" fill="#94a3b8" font-size="9" text-anchor="middle">(Local MCP Protocol Server)</text>
  </g>

  <!-- Tools -->
  <g transform="translate(930, 410)">
    <rect x="0" y="0" width="220" height="60" rx="6" fill="#0f172a"/>
    <rect x="0" y="0" width="220" height="60" rx="6" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="110" y="26" fill="white" font-size="12" font-weight="600" text-anchor="middle">Tools: mongodb_vector_search</text>
    <text x="110" y="42" fill="#94a3b8" font-size="9" text-anchor="middle">&amp; find_by_document_id</text>
  </g>

  <!-- QueryJS -->
  <g transform="translate(930, 530)">
    <rect x="0" y="0" width="220" height="60" rx="6" fill="#0f172a"/>
    <rect x="0" y="0" width="220" height="60" rx="6" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="110" y="26" fill="white" font-size="12" font-weight="600" text-anchor="middle">query_mongo.js</text>
    <text x="110" y="42" fill="#94a3b8" font-size="9" text-anchor="middle">(Driver MongoDB)</text>
  </g>

  <!-- VoyageAI -->
  <g transform="translate(290, 720)">
    <rect x="0" y="0" width="220" height="60" rx="6" fill="#0f172a"/>
    <rect x="0" y="0" width="220" height="60" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="110" y="26" fill="white" font-size="12" font-weight="600" text-anchor="middle">🧠 Voyage AI API</text>
    <text x="110" y="42" fill="#94a3b8" font-size="9" text-anchor="middle">(Embeddings 1024d)</text>
  </g>

  <!-- GoogleChat -->
  <g transform="translate(570, 720)">
    <rect x="0" y="0" width="220" height="60" rx="6" fill="#0f172a"/>
    <rect x="0" y="0" width="220" height="60" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="110" y="26" fill="white" font-size="12" font-weight="600" text-anchor="middle">💬 Google Chat Webhook</text>
    <text x="110" y="42" fill="#94a3b8" font-size="9" text-anchor="middle">(Notificaciones de Ingesta)</text>
  </g>

  <!-- MongoDB Cylinder -->
  <g transform="translate(960, 740)">
    <rect x="0" y="10" width="160" height="60" rx="2" fill="#0f172a"/>
    <ellipse cx="80" cy="10" rx="80" ry="12" fill="#0f172a"/>
    <ellipse cx="80" cy="70" rx="80" ry="12" fill="#0f172a"/>
    
    <rect x="0" y="10" width="160" height="60" fill="rgba(76,29,149,0.4)"/>
    <ellipse cx="80" cy="10" rx="80" ry="12" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
    <ellipse cx="80" cy="70" rx="80" ry="12" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
    <line x1="0" y1="10" x2="0" y2="70" stroke="#a78bfa" stroke-width="1.5"/>
    <line x1="160" y1="10" x2="160" y2="70" stroke="#a78bfa" stroke-width="1.5"/>
    
    <text x="80" y="40" fill="white" font-size="12" font-weight="600" text-anchor="middle">🍃 MongoDB Atlas</text>
    <text x="80" y="56" fill="#94a3b8" font-size="9" text-anchor="middle">($vectorSearch)</text>
  </g>

  <!-- Legend -->
  <g transform="translate(40, 900)">
    <rect x="0" y="0" width="16" height="16" rx="2" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="24" y="12" fill="#94a3b8" font-size="10">Entradas / Usuario</text>
    
    <rect x="160" y="0" width="16" height="16" rx="2" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
    <text x="184" y="12" fill="#94a3b8" font-size="10">Procesamiento (Python)</text>
    
    <rect x="350" y="0" width="16" height="16" rx="2" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="374" y="12" fill="#94a3b8" font-size="10">Agente / Servidor MCP (Node)</text>
    
    <rect x="580" y="0" width="16" height="16" rx="2" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="604" y="12" fill="#94a3b8" font-size="10">Base de Datos (MongoDB)</text>
    
    <rect x="780" y="0" width="16" height="16" rx="2" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="804" y="12" fill="#94a3b8" font-size="10">Servicios Cloud</text>
  </g>
</svg>
